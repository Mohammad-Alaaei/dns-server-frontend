# Frontend-only stack: Admin UI (nginx)
# Usage (from dns-admin-ui/ directory):
#   docker compose up -d --build
#
# Important:
#   - Set VITE_API_BASE_URL to the real backend API URL at build time
#     (e.g. http://192.168.1.10:3000) if the backend is on another host.
#
# SSL:
#   HTTPS_ENABLED=true|false   (default true)
#   SSL_MODE=selfsigned|custom|off  (default selfsigned; forced off if HTTPS_ENABLED=false)
#   SSL_CERT_HOSTS=localhost,127.0.0.1,my.host  (SAN list for self-signed)
#   For SSL_MODE=custom, place fullchain.pem + privkey.pem in ./certs/
#
# Ports:
#   80    → HTTP (redirects to HTTPS when enabled)
#   443   → HTTPS

name: dns-frontend

services:
  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-}
    restart: unless-stopped
    environment:
      HTTPS_ENABLED: ${HTTPS_ENABLED:-true}
      SSL_MODE: ${SSL_MODE:-selfsigned}
      SSL_CERT_HOSTS: ${SSL_CERT_HOSTS:-localhost,127.0.0.1}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # Persist self-signed certs; for custom mode put fullchain.pem + privkey.pem here
      - ${SSL_CERTS_DIR:-./certs}:/etc/nginx/certs
    networks:
      - frontend_net

networks:
  frontend_net:
    driver: bridge
